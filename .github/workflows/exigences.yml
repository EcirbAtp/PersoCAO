name: Exigences

# Vérifie que les fichiers StrictDoc sont valides (syntaxe, grammaire, liens
# entre UID) et publie les vues générées comme artefact téléchargeable.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "reqs/**"
      - "src/**"
      - "modules/**"
      - "tests/**"
      - "tools/**"
      - "strictdoc_config.py"
      - "requirements-docs.txt"
      - ".github/workflows/exigences.yml"

permissions:
  contents: read

jobs:
  vues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: ./tools/generer_vues.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exigences
          path: |
            build/html
            build/PersoCAO_exigences.xlsx
